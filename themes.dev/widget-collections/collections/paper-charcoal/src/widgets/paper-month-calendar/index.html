<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Month calendar</title>
    <link rel="icon" href="./assets/icon.svg" />
    <link rel="stylesheet" href="./widget.css" />
  </head>
  <body>
    <main id="widget" class="calendar" aria-label="Month calendar">
      <header class="calendar__header">
        <img src="./assets/icon.svg" alt="" />
        <strong data-month-label>Month</strong>
      </header>
      <table class="calendar__table">
        <thead><tr><th>Su</th><th>Mo</th><th>Tu</th><th>We</th><th>Th</th><th>Fr</th><th>Sa</th></tr></thead>
        <tbody>
          <tr><td data-day-cell>1</td><td data-day-cell>2</td><td data-day-cell>3</td><td data-day-cell>4</td><td data-day-cell>5</td><td data-day-cell>6</td><td data-day-cell>7</td></tr>
          <tr><td data-day-cell>8</td><td data-day-cell>9</td><td data-day-cell>10</td><td data-day-cell>11</td><td data-day-cell>12</td><td data-day-cell>13</td><td data-day-cell>14</td></tr>
          <tr><td data-day-cell>15</td><td data-day-cell>16</td><td data-day-cell>17</td><td data-day-cell>18</td><td data-day-cell>19</td><td data-day-cell>20</td><td data-day-cell>21</td></tr>
          <tr><td data-day-cell>22</td><td data-day-cell>23</td><td data-day-cell>24</td><td data-day-cell>25</td><td data-day-cell>26</td><td data-day-cell>27</td><td data-day-cell>28</td></tr>
          <tr><td data-day-cell>29</td><td data-day-cell>30</td><td data-day-cell>31</td><td data-day-cell>1</td><td data-day-cell>2</td><td data-day-cell>3</td><td data-day-cell>4</td></tr>
          <tr><td data-day-cell>5</td><td data-day-cell>6</td><td data-day-cell>7</td><td data-day-cell>8</td><td data-day-cell>9</td><td data-day-cell>10</td><td data-day-cell>11</td></tr>
        </tbody>
      </table>
    </main>
    <script type="module" src="./widget.js"></script>
  </body>
</html>
