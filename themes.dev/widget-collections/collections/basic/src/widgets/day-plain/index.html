<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plain day calendar</title>
    <link rel="stylesheet" href="./widget.css" />
  </head>
  <body data-basic-kind="day" data-basic-fields="" data-basic-control="">
    <main class="basic-widget basic-day"><section><strong>Formatted</strong><time><span data-basic-part="formatted-month">Jan</span> <span data-basic-part="formatted-day">1</span>, <span data-basic-part="formatted-year">2026</span></time></section><section><strong>Single day</strong><time><span data-basic-part="single-weekday">Monday</span> <span data-basic-part="single-day">1</span> <span data-basic-part="single-month">January</span> <span data-basic-part="single-year">2026</span></time></section></main>
    <script type="module" src="./widget.js"></script>
  </body>
</html>
