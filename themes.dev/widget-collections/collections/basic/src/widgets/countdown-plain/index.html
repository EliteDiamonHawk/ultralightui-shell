<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plain countdown timer</title>
    <link rel="stylesheet" href="./widget.css" />

  <body data-basic-kind="countdown" data-basic-fields="" data-basic-control="">
