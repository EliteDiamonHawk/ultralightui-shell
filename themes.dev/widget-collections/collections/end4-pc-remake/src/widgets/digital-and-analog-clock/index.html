<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Digital and Analog Clock</title>
    <link rel="stylesheet" href="./widget.css" />
  </head>
  <body>
    <div class="webskin-clock webskin-clock--digital-analog-prestyled webskin-clock--prestyled">
      <svg class="webskin-clock--analog-plain" data-webskin-clock-part="analog" viewBox="0 0 100 100" role="img" aria-label="Analog clock">
        <circle data-webskin-clock-part="face" cx="50" cy="50" r="44" />
        <line data-webskin-clock-part="tick" x1="50.000" y1="12.000" x2="50.000" y2="8.000" />
        <line data-webskin-clock-part="tick" x1="69.000" y1="17.091" x2="71.000" y2="13.627" />
        <line data-webskin-clock-part="tick" x1="82.909" y1="31.000" x2="86.373" y2="29.000" />
        <line data-webskin-clock-part="tick" x1="88.000" y1="50.000" x2="92.000" y2="50.000" />
        <line data-webskin-clock-part="tick" x1="82.909" y1="69.000" x2="86.373" y2="71.000" />
        <line data-webskin-clock-part="tick" x1="69.000" y1="82.909" x2="71.000" y2="86.373" />
        <line data-webskin-clock-part="tick" x1="50.000" y1="88.000" x2="50.000" y2="92.000" />
        <line data-webskin-clock-part="tick" x1="31.000" y1="82.909" x2="29.000" y2="86.373" />
        <line data-webskin-clock-part="tick" x1="17.091" y1="69.000" x2="13.627" y2="71.000" />
        <line data-webskin-clock-part="tick" x1="12.000" y1="50.000" x2="8.000" y2="50.000" />
        <line data-webskin-clock-part="tick" x1="17.091" y1="31.000" x2="13.627" y2="29.000" />
        <line data-webskin-clock-part="tick" x1="31.000" y1="17.091" x2="29.000" y2="13.627" />
        <line data-webskin-clock-part="hour-hand" x1="50" y1="50" x2="50" y2="27" />
        <line data-webskin-clock-part="minute-hand" x1="50" y1="50" x2="50" y2="16" />
        <line data-webskin-clock-part="second-hand" x1="50" y1="53" x2="50" y2="12" />
        <circle data-webskin-clock-part="pin" cx="50" cy="50" r="2.5" />
      </svg>
      <time class="webskin-clock--digital-plain" data-webskin-clock-part="digital" aria-label="Current time">
        <span data-webskin-clock-part="hours">00</span><span data-webskin-clock-part="separator">:</span><span data-webskin-clock-part="minutes">00</span><span data-webskin-clock-part="seconds-separator">:</span><span data-webskin-clock-part="seconds">00</span><span data-webskin-clock-part="period">AM</span>
      </time>
    </div>
    <script type="module" src="./widget.js"></script>
  </body>
</html>
