<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Script digital clock</title>
    <link rel="stylesheet" href="./widget.css" />
  </head>
  <body><time class="digital-prestyled" aria-label="Current time"><span data-hours>00</span><span class="digital-prestyled__separator">:</span><span data-minutes>00</span><span class="digital-prestyled__separator digital-prestyled__seconds-separator">:</span><span class="digital-prestyled__seconds" data-seconds>00</span><span class="digital-prestyled__period" data-period>AM</span></time>

  </body>
