<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rainmeter Ageo time and day (modified)</title>
    <link rel="stylesheet" href="./widget.css" />
  </head>
  <body>
    <main id="widget" class="ageo" aria-label="Current date and time">
      <time class="ageo__date" datetime="2026-01-01" aria-label="Day of month"><span data-day>26</span></time>
      <span class="ageo__month" data-month>November</span>
      <span class="ageo__weekday" data-weekday>THURSDAY</span>
      <time class="ageo__time" data-time-datetime datetime="12:00"><span data-time>7:04</span> <span data-period>AM</span></time>
      <span class="ageo__line" aria-hidden="true"></span>
      <p class="ageo__quote" data-quote>Your Quotes Go Here</p>
    </main>
    <script type="module" src="./widget.js"></script>
  </body>
</html>
